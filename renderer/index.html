<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Aftertaste</title>
  <link rel="stylesheet" href="app.css">
  <script src="i18n.js" defer></script>
  <script src="library-tools.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="library" data-i18n-aria-label="nav.home"><span class="brand-icon">a</span> aftertaste<span class="brand-star">✦</span></button>
    <nav data-i18n-aria-label="nav.library"><button class="nav-button active" data-action="library"><small>01</small> <span data-i18n="nav.library">Library</span></button><button class="nav-button" data-action="for-you"><small>02</small> <span data-i18n="nav.recommendations">Recommendations</span></button></nav>
    <div class="top-actions"><div class="language-picker" role="group" data-i18n-aria-label="nav.languages"><button data-language="en" aria-label="English" title="English" aria-pressed="true">🇺🇸</button><button data-language="ru" aria-label="Русский" title="Русский" aria-pressed="false">🇷🇺</button><button data-language="fr" aria-label="Français" title="Français" aria-pressed="false">🇫🇷</button></div><button class="quiet-button" data-action="settings" data-i18n="nav.settings">Settings</button><button class="button compact" data-action="add" data-i18n="nav.add">＋ Add</button></div>
  </header>
  <main>
    <section class="hero">
      <img src="assets/midnight-library.webp" data-i18n-aria-label="hero.image" alt="An anime reader with a book by a window overlooking the sea at night" width="1942" height="809">
      <div class="hero-copy"><p class="pixel eyebrow" data-i18n="hero.eyebrow">LIBRARY & NOTES</p><h1 data-i18n="hero.title">Read. Watch. Take notes.</h1><p data-i18n="hero.body">Save books, videos and games. Keep your thoughts next to them.</p><div class="hero-bottom"><span>✦</span> <span data-i18n="hero.bottom">YOUR LIBRARY. YOUR NOTES.</span></div></div>
      <span class="hero-corner pixel">MEMORY CARD / 01</span>
    </section>
    <div id="content" aria-live="polite"><p class="loading" data-i18n="loading">Opening library…</p></div>
  </main>
  <footer><span class="pixel">AFTERTASTE</span><span id="footer-status">Aftertaste</span></footer>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
